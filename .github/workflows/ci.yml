# Monorepo CI — 安全门、Python、前端、Frist-API 与文档治理
# 触发: push/PR 到 main 分支；文档变更同样运行，避免文档治理被路径过滤跳过。

name: OpenClaw CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GitHub 默认未显式指定 shell 时只使用 bash -e；显式指定 bash 才会启用 pipefail。
defaults:
  run:
    shell: bash

# 同一分支的新推送取消正在跑的旧 CI，节省 Actions 分钟数。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 密钥扫描 + 依赖高危漏洞门禁 ───
  security-gates:
    runs-on: ubuntu-latest

    steps:
      # 第三方 Action 固定到 2026-07-12 复核过的完整提交 SHA；行尾保留 tag 便于人工升级。
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Audit desktop dependencies
        working-directory: apps/openclaw-manager-src
        run: npm audit --audit-level=high

      - name: Audit Frist-API dependencies
        working-directory: apps/frist-api
        run: npm audit --audit-level=high

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Audit backend Python dependencies
        working-directory: packages/clawbot
        run: |
          uv pip install --system pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt --vulnerability-service pypi --progress-spinner off --cache-dir /tmp/openclaw-pip-audit-cache --timeout 10

  # ─── Python 后端测试 + Lint ───
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('packages/clawbot/requirements.txt', 'packages/clawbot/requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv pip install --system -r packages/clawbot/requirements-dev.txt

      - name: Run Python quality gate
        run: make ci-python PYTHON=python
        env:
          # 测试环境变量，避免依赖外部服务。
          TESTING: "true"
          LITELLM_LOG: "ERROR"

  # ─── 前端 ESLint + TypeScript + 构建 ───
  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/openclaw-manager-src/package-lock.json

      - name: Install dependencies
        working-directory: apps/openclaw-manager-src
        run: npm ci

      - name: Run frontend quality gate
        run: make ci-frontend

  # ─── Frist-API 确定性测试 ───
  frist-api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/frist-api/package-lock.json

      - name: Install dependencies
        working-directory: apps/frist-api
        run: npm ci

      - name: Run Frist-API quality gate
        run: make ci-frist-api

  # ─── 文档治理 ───
  docs-governance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run docs governance gate
        run: make ci-docs
