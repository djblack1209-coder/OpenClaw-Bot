# Monorepo CI — Python 后端 + JIYU AI 运维工具 + Tauri 桌面端 + 安全门禁
# 触发: push 到 main；PR 覆盖所有目标分支
# 优化: uv 缓存 / npm 缓存 / 同分支并发取消

name: OpenClaw CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/nightly-audit/**'
  pull_request:
    paths-ignore:
      - 'scripts/nightly-audit/**'

# 同一分支的新推送取消正在跑的旧 CI，节省 Actions 分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─── 密钥扫描 + 依赖高危漏洞门禁 ───
  security-gates:
    runs-on: ubuntu-latest

    steps:
      # 参考 GitHub Actions 官方 marketplace/release（2026-07-02 复核）：v6/v8 动作使用新版 Node 运行时，避免旧 Node 20 预警继续漂移。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install security linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          uv pip install --system pip-audit

      - name: Lint repository shell scripts
        run: make shellcheck

      - name: Audit locked dependencies
        run: make dependency-audit

      - name: Verify immutable workflow and npm runtime locks
        run: make supply-chain-check

      - name: Validate documentation governance
        run: bash scripts/check_docs_layout.sh

  # ─── Python 后端测试 + Lint ───
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/clawbot

    steps:
      # 参考 GitHub Actions 官方 marketplace/release（2026-07-02 复核）：checkout/setup-python/cache 均固定到已发布新版主版本。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('packages/clawbot/requirements-lock.txt') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          uv pip install --system --require-hashes -r requirements-lock.txt

      - name: Verify Python dependency lock
        working-directory: .
        run: make python-lock-check

      - name: Ruff lint check
        run: |
          ruff check src/ --config ruff.toml \
            --select E,W,F,B \
            --ignore E501,E402,E701,E702,E741,B008,B905,B904,B004,B005,B007

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ \
            --tb=short -q \
            --cov=src --cov-report=term-missing --cov-fail-under=40 \
            --timeout=120 \
            -o "addopts=" \
            2>&1 | tee pytest-output.txt
        env:
          # 测试环境变量，避免依赖外部服务
          TESTING: "true"
          LITELLM_LOG: "ERROR"

      - name: Enforce critical-path coverage
        working-directory: .
        run: make critical-coverage-check

      - name: Syntax check source files
        run: |
          python -m py_compile multi_main.py
          find src/ -name "*.py" -exec python -m py_compile {} +

  # ─── 桌面端类型、编译与安全边界检查 ───
  frontend-desktop-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/openclaw-manager-src

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/openclaw-manager-src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Frontend lint
        run: npm run lint

      - name: Frontend production build
        run: npm run build

      - name: Desktop security boundary tests
        working-directory: .
        run: >-
          node --test
          apps/openclaw-manager-src/src/lib/security-hardening.static.test.mjs
          apps/openclaw-manager-src/src/components/Social/social-growth-feedback.static.test.mjs
          scripts/auto_ops_scripts.test.mjs

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install RustSec audit
        run: cargo install cargo-audit --locked

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Rust tests and compile check
        working-directory: apps/openclaw-manager-src/src-tauri
        run: |
          cargo audit --file Cargo.lock
          cargo test --locked
          cargo check --locked
