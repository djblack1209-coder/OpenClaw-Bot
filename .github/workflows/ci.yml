# Monorepo CI — Python 后端 + Frist-API + Tauri 桌面端 + 安全门禁
# 触发: push/PR 到 main 分支
# 优化: uv 缓存 / npm 缓存 / 同分支并发取消

name: OpenClaw CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/nightly-audit/**'
      - 'apps/openclaw/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'scripts/nightly-audit/**'
      - 'apps/openclaw/**'

# 同一分支的新推送取消正在跑的旧 CI，节省 Actions 分钟数
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 密钥扫描 + 依赖高危漏洞门禁 ───
  security-gates:
    runs-on: ubuntu-latest

    steps:
      # 参考 GitHub Actions 官方 marketplace/release（2026-07-02 复核）：v6/v8 动作使用新版 Node 运行时，避免旧 Node 20 预警继续漂移。
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Audit desktop dependencies
        working-directory: apps/openclaw-manager-src
        run: npm audit --audit-level=high --omit=dev

      - name: Audit Frist-API dependencies
        working-directory: apps/frist-api
        run: npm audit --audit-level=high --omit=dev

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Audit backend Python dependencies
        working-directory: packages/clawbot
        run: |
          uv pip install --system pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt --vulnerability-service pypi --progress-spinner off --cache-dir /tmp/openclaw-pip-audit-cache --timeout 10

      - name: Validate documentation governance
        run: bash scripts/check_docs_layout.sh

  # ─── Python 后端测试 + Lint ───
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/clawbot

    steps:
      # 参考 GitHub Actions 官方 marketplace/release（2026-07-02 复核）：checkout/setup-python/cache 均固定到已发布新版主版本。
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('packages/clawbot/requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements-dev.txt

      - name: Ruff lint check
        run: |
          uv pip install --system ruff
          ruff check src/ --config ruff.toml \
            --select E,W,F,B \
            --ignore E501,E402,E701,E702,E741,B008,B905,B904,B004,B005,B007

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ \
            --tb=short -q \
            --cov=src --cov-report=term-missing \
            --timeout=120 \
            -o "addopts=" \
            2>&1 | tee pytest-output.txt
        env:
          # 测试环境变量，避免依赖外部服务
          TESTING: "true"
          LITELLM_LOG: "ERROR"

      - name: Syntax check source files
        run: |
          python -m py_compile multi_main.py
          find src/ -name "*.py" -exec python -m py_compile {} +

  # ─── Frist-API 业务与多租户边界测试 ───
  frist-api-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 24]
    defaults:
      run:
        working-directory: apps/frist-api

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: apps/frist-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Frist-API tests
        run: npm test

  # ─── 桌面端类型、编译与安全边界检查 ───
  frontend-desktop-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/openclaw-manager-src

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/openclaw-manager-src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Desktop security boundary tests
        working-directory: .
        run: >-
          node --test
          apps/openclaw-manager-src/src/lib/security-hardening.static.test.mjs
          apps/openclaw-manager-src/src/components/Social/social-growth-feedback.static.test.mjs
          scripts/auto_ops_scripts.test.mjs

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Rust tests and compile check
        working-directory: apps/openclaw-manager-src/src-tauri
        run: |
          cargo test --locked
          cargo check --locked
