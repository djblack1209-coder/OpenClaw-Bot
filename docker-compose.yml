services:
  # docker compose 默认只读取仓库根目录 .env。
  # 部署时显式提供配置文件；先执行 config --quiet 校验，启动是独立操作。
  # ── Redis（可选，用于任务队列持久化）──────────────
  redis:
    image: redis:7.2-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    # 安全: REDIS_PASSWORD 必须通过 .env 文件或环境变量设置，不提供默认值
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru --requirepass "${REDIS_PASSWORD:?请通过 --env-file packages/clawbot/config/.env 或环境变量设置 REDIS_PASSWORD}"
    restart: unless-stopped
    # 安全: 非 root 用户运行 (redis 镜像内置 redis 用户)
    user: "999:999"
    security_opt:
      - no-new-privileges:true
    # 资源限制: 2GB 服务器，Redis 分配 128M 足够（仅做队列缓存）
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?请通过 --env-file packages/clawbot/config/.env 或环境变量设置 REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      # Redis 只在内部网络，不暴露给外部
      - clawbot-internal

  # ── OpenClaw 主服务 ──────────────────────────────
  # Dockerfile 使用 Linux x86_64 哈希锁；构建通过不代表真实业务已验收。
  openclaw:
    # Python 生产哈希锁面向 Oracle/Linux x86_64；Mac 本机构建时由 Docker 透明模拟同一目标。
    platform: linux/amd64
    build:
      context: ./packages/clawbot
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18790:18790"   # 内控 API（仅本机访问）
      - "127.0.0.1:9090:9090"     # Prometheus metrics（仅本机访问）
    volumes:
      - ./packages/clawbot/config:/app/config:ro
      - ./packages/clawbot/data:/app/data
      - ./packages/clawbot/logs:/app/logs
    env_file:
      - ./packages/clawbot/config/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?请通过 --env-file packages/clawbot/config/.env 或环境变量设置 REDIS_PASSWORD}@redis:6379/0
      - OMEGA_DAILY_BUDGET=50.0
      - API_HOST=0.0.0.0
      - API_PORT=18790
      - ENV=production
      # Compose 已注入 env_file；非 root 应用不重读宿主用户的 0600 密钥文件。
      - PYTHON_DOTENV_DISABLED=1
      - OPENCLAW_API_TOKEN=${OPENCLAW_API_TOKEN:?请显式设置 OPENCLAW_API_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 安全: 限制容器权限
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # 资源限制: 2GB 服务器，主服务分配 1G（含 Python 运行时 + 业务逻辑）
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; request = urllib.request.Request('http://localhost:18790/api/v1/ping', headers={'X-API-Token': os.environ['OPENCLAW_API_TOKEN']}); urllib.request.urlopen(request, timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      # 应用服务同时接入内部网络（访问 Redis）和外部网络（访问 Telegram/LLM API）
      - clawbot-internal
      - clawbot-external

volumes:
  redis_data:

networks:
  # 内部网络: Redis 专用，隔离外网访问，仅容器间通信
  clawbot-internal:
    driver: bridge
    internal: true
  # 外部网络: openclaw 主服务用，允许访问 Telegram Bot API / LLM API 等外部服务
  clawbot-external:
    driver: bridge
