[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 默认选项: 首个失败即停止 + 简洁回溯 + 禁用警告噪音
addopts = -x --tb=short -q
# 过滤第三方库的 DeprecationWarning 噪音
# 参考 pytest 9.0 warnings 配置文档（2026-07-02 复核）：filterwarnings 只用于隔离上游兼容提示，不隐藏项目代码告警。
filterwarnings =
    ignore::DeprecationWarning:telegram.*
    ignore::DeprecationWarning:httpx.*
    ignore::DeprecationWarning:litellm.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:Warning:fastapi.testclient
    ignore:co_lnotab is deprecated, use co_lines instead.*:DeprecationWarning
    ignore:pkg_resources is deprecated as an API:UserWarning:jieba.*
